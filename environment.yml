# Environment for the roadrdd release.
#
# Section 4.2 of the manuscript reports the experiments on a single NVIDIA RTX A6000 (48 GB)
# with PyTorch 2.1 and CUDA 11.8, and the pins below follow that stack.  The same code also
# runs on newer CUDA 11.8 builds of PyTorch (the previous release of this repository pinned
# 2.4.0 / torchvision 0.19.0); the Python-level API used by the training, validation and
# profiling scripts is unchanged between those versions.
name: roadrdd
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip=24.0
  - pytorch=2.1.0
  - torchvision=0.16.0
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.2
  - matplotlib=3.8.4
  - pillow=10.3.0
  - pyyaml=6.0.1
  - tqdm=4.66.4
  - opencv=4.9.0
  - pytest=8.2.0
  - pip:
      - prettytable>=3.9
      - pycocotools>=2.0.7
      - tidecv>=1.0.1
      - fvcore==0.1.5.post20221221
      - timm>=0.9.0
      - efficientnet_pytorch>=0.7.1
      - einops>=0.7
      - dill>=0.3.8
      - PyWavelets>=1.4
      - seaborn>=0.13
