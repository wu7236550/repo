  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=11.8
  - numpy=1.26.4
  - scipy=1.13.0
  - pandas=2.2.2
  - matplotlib=3.8.4
  - pillow=10.3.0
  - pyyaml=6.0.1
  - tqdm=4.66.4
  - opencv=4.9.0
  - pytest=8.2.0
