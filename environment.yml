      - prettytable>=3.9
      - pycocotools>=2.0.7
      - tidecv>=1.0.1
      - fvcore==0.1.5.post20221221
      - timm>=0.9.0
      - efficientnet_pytorch>=0.7.1
      - einops>=0.7
      - dill>=0.3.8
      - PyWavelets>=1.4
      - seaborn>=0.13
