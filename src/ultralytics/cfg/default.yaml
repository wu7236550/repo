# Ultralytics YOLO 🚀, AGPL-3.0 license

task: detect
mode: train

model:
data:
epochs: 100
patience: 0
batch: 4
imgsz: 640
save: True
save_period: -1
cache: False
device:
workers: 4
project: runs/train
name: exp
exist_ok: False
pretrained: True
optimizer: AdamW
verbose: True
seed: 0
deterministic: True
single_cls: False
rect: False
cos_lr: True  # manuscript Table 4: cosine schedule, 1e-4 -> 1e-6 over 240 epochs
close_mosaic: 15  # manuscript Table 4: mosaic closed over the last 15 epochs
resume: False
amp: False
fraction: 1.0
profile: False
freeze: None
overlap_mask: True
mask_ratio: 4
dropout: 0.0

val: True
split: val
save_json: False
save_hybrid: False
conf:
iou: 0.7
max_det: 300
half: False
dnn: False
plots: True

source:
show: False
save_txt: False
save_conf: False
save_crop: False
show_labels: True
show_conf: True
vid_stride: 1
stream_buffer: False
line_width:
visualize: False
augment: False
agnostic_nms: False
classes:
retina_masks: False
boxes: True

format: torchscript  # (str) format to export to, choices at https://docs.ultralytics.com/modes/export/#export-formats
keras: False
optimize: False
int8: False
dynamic: False
simplify: False
opset:
workspace: 4
nms: False

lr0: 0.0001  # manuscript Table 4: base learning rate 1e-4
lrf: 0.01  # final LR factor; with cos_lr this decays 1e-4 -> 1e-6 (Table 4)
momentum: 0.9
weight_decay: 0.0001  # manuscript Table 4: weight decay 1e-4
# NOTE: in this fork the warm-up loop compares warmup_epochs against the *global iteration*
# index, not against the epoch number, so the value below is an iteration budget. 2000
# iterations is about 5 epochs on the released training split, i.e. Table 4's "5 epochs,
# linear" warm-up.
warmup_epochs: 2000
warmup_momentum: 0.8
warmup_bias_lr: 0.1
# NOTE: these three gains belong to the YOLO training path. RT-DETR uses
# RTDETRDetectionLoss, whose gains come from DETRLoss's default
# {'class': 1, 'bbox': 5, 'giou': 2} (manuscript Table 4: cls 1.0, bbox 5.0, giou 2.0),
# so the values below are inert for this model.
box: 7.5
cls: 0.5
dfl: 1.5
pose: 12.0
kobj: 1.0
label_smoothing: 0.0
nbs: 64
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 0.0
translate: 0.1
scale: 0.5
shear: 0.0
perspective: 0.0
flipud: 0.0
fliplr: 0.5
mosaic: 0.2  # released recipe value; Table 4 names mosaic but not its probability
mixup: 0.0
copy_paste: 0.0

cfg:

tracker: botsort.yaml
