# Position-encoding control: static relative-position-bias lookup table (Swin style).
# No absolute positional encoding is added to the tokens; instead a trainable
# (8, 25, 25) table is addressed by the integer relative-position index of the
# 13x13 S5 grid at the 416x416 training resolution. It shares the relative-position
# index space of LRPB, so rtdetr-control-PE-static.yaml and rtdetr-LRPB-AIFI.yaml
# differ only in whether the bias is read from a table or produced by an MLP.
nc: 2
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, ConvNormLayer, [32, 3, 2, None, False, 'relu']]
  - [-1, 1, ConvNormLayer, [32, 3, 1, None, False, 'relu']]
  - [-1, 1, ConvNormLayer, [64, 3, 1, None, False, 'relu']]
  - [-1, 1, nn.MaxPool2d, [3, 2, 1]]

  - [-1, 1, Blocks, [64, BasicBlock, 2, 2, 'relu']]
  - [-1, 1, Blocks, [128, BasicBlock, 2, 3, 'relu']]
  - [-1, 1, Blocks, [256, BasicBlock, 2, 4, 'relu']]
  - [-1, 1, Blocks, [512, BasicBlock, 2, 5, 'relu']]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [-1, 1, PE_AIFI, [1024, 'static', 8, 13]]
  - [-1, 1, Conv, [256, 1, 1]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [6, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]
  - [-1, 1, Conv, [256, 1, 1]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [5, 1, Conv, [256, 1, 1, None, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 3, RepC3, [256, 0.5]]

  - [[19, 22, 25], 1, RTDETRDecoder, [nc, 256, 300, 4, 8, 3]]
